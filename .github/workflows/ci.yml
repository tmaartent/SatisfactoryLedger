# CI for Satisfactory Ledger. See docs/guide/07-quality-and-delivery.md § "CI pipeline".
# backend and frontend run in parallel. The backend job also checks the OpenAPI contract.
# After a merge to main, the journeys job also runs the app against the real stack (step 97).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # The save-file library is a git submodule, pinned to one commit of our fork (ADR-0013).
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The build regenerates api/openapi.json (ADR-0006). If it differs from the committed file,
      # or a new document appeared, someone changed the API contract without committing it.
      # git status also catches new untracked files, which git diff would miss.
      - name: Check OpenAPI contract is committed
        run: |
          if [ -n "$(git status --porcelain -- api/)" ]; then
            echo "::error::The OpenAPI document changed. Build locally and commit api/."
            git status --short -- api/
            git diff -- api/
            exit 1
          fi

      # Every test project has tests, so "zero tests ran" (exit code 8) fails the build (ADR-0014).
      # Api.IntegrationTests starts PostgreSQL with Testcontainers; ubuntu-latest has Docker.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Before the tests: both are quick, and neither needs the generated API client.
      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  # Step 95: the World pages on a phone (Chromium and WebKit), a tablet and a desktop, in real browsers. The API's
  # answers are recorded (web/e2e/fixtures/api.json), so this job needs neither .NET nor PostgreSQL.
  e2e:
    name: Layout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The browsers, and the Linux libraries they need.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test
        run: npm run e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  # Step 97: journeys against the real stack, nothing recorded: the web app, the API, the analysis service, PostgreSQL
  # and RabbitMQ. Only after a merge to main (asked 2026-11-25), so a PR's checks don't wait for it; on the desktop only.
  # Not the AppHost: it also starts Ollama, on a GPU the runner hasn't got. The two services run as the AppHost would
  # wire them, by the same connection strings and service addresses.
  journeys:
    name: Journeys (real stack)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__ledger: Host=localhost;Port=5432;Database=ledger;Username=postgres;Password=postgres
      ConnectionStrings__rabbitmq: amqp://guest:guest@localhost:5672
      # Where the analysis service and the dev server's proxy find the API, as the AppHost's WithReference(api) says.
      services__api__http__0: http://localhost:5219
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: dotnet build --configuration Release

      # In Development, as under the AppHost: the API migrates its database when it starts. Its http profile listens on
      # 5219. Their logs go to files, uploaded when the journeys fail.
      - name: Start the API and the analysis service
        run: |
          mkdir -p logs
          dotnet run --no-build --configuration Release --project src/SatisfactoryLedger.Api --launch-profile http > logs/api.log 2>&1 &
          for attempt in $(seq 60); do curl -sf http://localhost:5219/health && break; sleep 2; done
          curl -sf http://localhost:5219/health || { cat logs/api.log; exit 1; }
          DOTNET_ENVIRONMENT=Development dotnet run --no-build --configuration Release --project src/SatisfactoryLedger.AnalysisService > logs/analysis.log 2>&1 &

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Journeys
        working-directory: web
        run: npm run e2e:stack

      - name: Upload report and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journeys-report
          path: |
            web/playwright-report
            logs
          if-no-files-found: ignore
