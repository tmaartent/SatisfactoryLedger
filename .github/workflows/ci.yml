# CI for Satisfactory Ledger. See docs/guide/07-quality-and-delivery.md § "CI pipeline".
# backend and frontend run in parallel. Planned jobs that are not here yet:
#   contract  (generate OpenAPI and fail on drift) - once the API has endpoints
#   lint      (ng lint)                            - once angular-eslint is added
#   e2e       (Playwright)                         - later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # --ignore-exit-code 8: exit code 8 means "zero tests ran". The *.Domain.Tests and
      # Api.IntegrationTests projects are still empty. Remove this flag once every test
      # project has tests, so a project that silently loses all its tests fails the build.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --ignore-exit-code 8
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build
