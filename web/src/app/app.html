<mat-toolbar class="toolbar">
  <mat-icon class="logo">factory</mat-icon>
  <span class="title">Satisfactory Ledger</span>
  <nav>
    <a mat-button [routerLink]="world()" [class.active]="inWorld()">World</a>
    <a mat-button routerLink="/catalog" routerLinkActive="active">Catalog</a>
  </nav>
</mat-toolbar>
<!-- The page, and on its right the sidebar with the page's tabs and the explanation (asked 2026-11-22). -->
<div class="shell">
  <main [class.picks-snapshot]="picksSnapshot()">
    <router-outlet />
  </main>
  @if (inWorld()) {
    <!-- On every World page, last: it stays while the player follows its links. Its code loads when it's first shown. -->
    <ng-template appSidebarTab="explanation" label="Explanation" icon="lightbulb" [order]="9">
      @defer {
        <app-explain-panel />
      }
    </ng-template>
  }
  @if (sidebar.tabs().length > 0) {
    <app-sidebar>
      <!-- Above the tabs on every World page: the snapshot they're all about (asked 2026-11-23). Its code, with the
           menu and dialogs it needs, loads once the page is up, not with the shell: when the browser is idle, or after
           2 s at the latest. A 3D view draws every frame, so the browser is seldom idle beside it: on a busy phone the
           picker didn't come (found by the layout tests, 2026-11-25). -->
      @if (picksSnapshot()) {
        @defer (on idle; on timer(2s)) {
          <app-snapshot-picker [current]="snapshotId()" />
        }
      }
    </app-sidebar>
  }
</div>
